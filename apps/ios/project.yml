# Generate the Xcode project with:  cd apps/ios && xcodegen
# The BirdNET files live in ml/models/coreml (Git LFS); see apps/ios/README.md.
# Signing: copy Config/Local.xcconfig.example to Config/Local.xcconfig and set your team.
name: Overheard
options:
  bundleIdPrefix: app.overheardbirds
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  OverheardKit:
    path: OverheardKit
targets:
  Overheard:
    type: application
    platform: iOS
    dependencies:
      - package: OverheardKit
    sources:
      - path: Overheard
      - path: ../../ml/models/coreml/BirdNETAudio.mlpackage
      - path: ../../ml/models/coreml/BirdNETMeta.mlpackage
      - path: ../../ml/models/coreml/species.json
        buildPhase: resources
      # Bird drawings, one PNG per species code; kept as a folder so they load from "cutouts/".
      - path: ../../art/birds/cutouts
        type: folder
        buildPhase: resources
    info:
      path: Overheard/Info.plist
      properties:
        CFBundleDisplayName: Overheard
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        UIAppFonts:
          - IMFellEnglish-Regular.ttf
          - IMFellEnglish-Italic.ttf
          - IMFellEnglishSC-Regular.ttf
          - EBGaramond-Regular.ttf
          - EBGaramond-Medium.ttf
          - EBGaramond-SemiBold.ttf
          - EBGaramond-Italic.ttf
          - Caveat-Medium.ttf
          - Caveat-SemiBold.ttf
        NSMicrophoneUsageDescription: Overheard listens for birdsong during your walk. Audio is analyzed on your phone and never uploaded.
        NSLocationWhenInUseUsageDescription: Overheard uses your approximate location to know which birds live nearby this time of year, so it can identify them more accurately. Your location stays on your phone.
    scheme:
      # Turn on in Xcode (Product → Scheme → Edit Scheme → Arguments) to open on a sample walk.
      commandLineArguments:
        "-demo": false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.overheardbirds.Overheard
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

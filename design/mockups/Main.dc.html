<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&amp;family=IM+Fell+English+SC&amp;family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=Caveat:wght@500;600&amp;display=swap">
<style>

a{color:#8b2f1c}a:hover{color:#6a2213}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.chromeBg}}; color: {{t.chromeInk}}; font-family: 'EB Garamond', Garamond, Georgia, serif; overflow: hidden">

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 56px 22px 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'IM Fell English SC', Georgia, serif; font-size: 15px; letter-spacing: 0.14em; color: {{t.accent}}">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.accent}}; box-shadow: 0 0 0 4px {{t.accentHalo}}"></span>
        Listening
      </div>
      <div style="font-size: 17px; font-variant-numeric: tabular-nums; color: {{t.chromeSoft}}">0:42:18</div>
    </div>
    <h1 style="margin: 0; font-family: 'IM Fell English', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1">The Ramble, Central Park</h1>
  </div>

  <svg width="346" height="26" viewBox="0 0 346 26" style="margin: 2px 22px 10px" aria-hidden="true">
    <g stroke="{{t.chromeSoft}}" stroke-width="2" stroke-linecap="round">
      <line x1="2" y1="11" x2="2" y2="15"/><line x1="10" y1="9" x2="10" y2="17"/><line x1="18" y1="12" x2="18" y2="14"/><line x1="26" y1="7" x2="26" y2="19"/><line x1="34" y1="10" x2="34" y2="16"/><line x1="42" y1="12" x2="42" y2="14"/><line x1="50" y1="8" x2="50" y2="18"/><line x1="58" y1="11" x2="58" y2="15"/><line x1="66" y1="12" x2="66" y2="14"/><line x1="74" y1="9" x2="74" y2="17"/><line x1="82" y1="11" x2="82" y2="15"/><line x1="90" y1="12" x2="90" y2="14"/><line x1="98" y1="10" x2="98" y2="16"/><line x1="106" y1="12" x2="106" y2="14"/><line x1="114" y1="11" x2="114" y2="15"/><line x1="122" y1="9" x2="122" y2="17"/><line x1="130" y1="12" x2="130" y2="14"/><line x1="138" y1="11" x2="138" y2="15"/><line x1="146" y1="12" x2="146" y2="14"/><line x1="154" y1="10" x2="154" y2="16"/><line x1="162" y1="12" x2="162" y2="14"/><line x1="170" y1="11" x2="170" y2="15"/><line x1="178" y1="12" x2="178" y2="14"/><line x1="186" y1="10" x2="186" y2="16"/><line x1="194" y1="12" x2="194" y2="14"/><line x1="202" y1="11" x2="202" y2="15"/><line x1="210" y1="12" x2="210" y2="14"/><line x1="218" y1="9" x2="218" y2="17"/><line x1="226" y1="12" x2="226" y2="14"/>
    </g>
    <g stroke="{{t.accent}}" stroke-width="2" stroke-linecap="round">
      <line x1="234" y1="8" x2="234" y2="18"/><line x1="242" y1="4" x2="242" y2="22"/><line x1="250" y1="2" x2="250" y2="24"/><line x1="258" y1="6" x2="258" y2="20"/><line x1="266" y1="3" x2="266" y2="23"/><line x1="274" y1="7" x2="274" y2="19"/><line x1="282" y1="5" x2="282" y2="21"/><line x1="290" y1="9" x2="290" y2="17"/><line x1="298" y1="6" x2="298" y2="20"/><line x1="306" y1="10" x2="306" y2="16"/><line x1="314" y1="8" x2="314" y2="18"/><line x1="322" y1="11" x2="322" y2="15"/><line x1="330" y1="12" x2="330" y2="14"/><line x1="338" y1="12" x2="338" y2="14"/>
    </g>
  </svg>

  <div style="position: relative; flex: 1; margin: 0 12px; border-radius: 6px; background: {{t.page}}; box-shadow: {{t.pageShadow}}; color: #2a1f15; overflow: hidden">
    <div style="position: absolute; left: 18px; top: 14px; font-family: 'Caveat', 'Bradley Hand', cursive; font-size: 19px; color: {{t.pageSoft}}">Sat 18 Oct · 7:12am · cool, overcast</div>

    <img src="/_blob/ada809a0465b2fcb45942057d711150b" alt="White-throated Sparrow, heard 4 times" style="position: absolute; left: 8px; top: 96px; width: 190px; height: 190px; mix-blend-mode: multiply; filter: {{t.birdFilter}}">
    <div style="position: absolute; left: 30px; top: 280px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1">White-throated Sparrow <span style="color: {{t.pageSoft}}">×4</span></div>

    <img src="/_blob/8f365bd7214e443ff2cf0ee234c7cdf9" alt="Blue Jay, heard 3 times" style="position: absolute; left: 192px; top: 44px; width: 160px; height: 160px; mix-blend-mode: multiply; filter: {{t.birdFilter}}">
    <div style="position: absolute; left: 236px; top: 200px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1">Blue Jay <span style="color: {{t.pageSoft}}">×3</span></div>

    <img src="/_blob/0a624eb0796ba7b39e29409b04e66bdf" alt="Northern Cardinal, heard twice" style="position: absolute; left: 210px; top: 216px; width: 128px; height: 128px; mix-blend-mode: multiply; filter: {{t.birdFilter}}">
    <div style="position: absolute; left: 232px; top: 340px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1">Cardinal <span style="color: {{t.pageSoft}}">×2</span></div>

    <img src="/_blob/db888ba88e4ac8533bb8d7798e61960a" alt="Red-tailed Hawk, heard once" style="position: absolute; left: 40px; top: 312px; width: 104px; height: 104px; mix-blend-mode: multiply; filter: {{t.birdFilter}}">
    <div style="position: absolute; left: 46px; top: 410px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1">Red-tailed<br>Hawk</div>

    <img src="/_blob/a4dcd1b7c04ab0e4b58990c6765620fe" alt="Black-throated Blue Warbler, still being sketched" style="position: absolute; left: 150px; top: 360px; width: 104px; height: 104px; mix-blend-mode: multiply; opacity: 0.38; filter: {{t.sketchFilter}}">
    <div style="position: absolute; left: 155px; top: 365px; width: 94px; height: 94px; border: 1.5px dashed {{t.accentOnPage}}; border-radius: 50%; opacity: 0.55"></div>
    <div style="position: absolute; left: 258px; top: 384px; font-family: 'Caveat', cursive; font-size: 19px; line-height: 1.05; color: {{t.accentOnPage}}">sketching…<br>Black-throated<br>Blue Warbler</div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 22px 0; font-size: 15px; color: {{t.chromeSoft}}">
    <span style="font-family: 'IM Fell English SC', Georgia, serif; letter-spacing: 0.1em; color: {{t.accent}}">Just heard</span>
    <span style="font-style: italic; color: {{t.chromeInk}}">Black-throated Blue Warbler</span>
    <span style="margin-left: auto; font-variant-numeric: tabular-nums">94% sure</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 22px 14px">
    <div style="display: flex; flex-direction: column; line-height: 1.15; margin-right: auto">
      <span style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">6 species</span>
      <span style="font-size: 14px; color: {{t.chromeSoft}}">14 calls · 1.6 mi</span>
    </div>
    <button type="button" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 1.5px solid {{t.chromeInk}}; background: transparent; color: {{t.chromeInk}}; font-family: inherit; font-size: 17px; display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="2" x2="4" y2="12"/><line x1="10" y1="2" x2="10" y2="12"/></g></svg>
      Pause
    </button>
    <button type="button" style="height: 48px; padding: 0 20px; border-radius: 24px; border: 0; background: {{t.accent}}; color: {{t.accentInk}}; font-family: inherit; font-size: 17px; font-weight: 500">End walk</button>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 28px; border-top: 1px solid {{t.rule}}; background: {{t.tabBg}}">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; text-decoration: none; color: {{t.accent}}; font-size: 13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M8 8v8M16 8v8M4 11v2M20 11v2"/></svg>
      Listen
    </a>
    <a href="Journal.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; text-decoration: none; color: {{t.tabSoft}}; font-size: 13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>
      Journal
    </a>
    <a href="Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; text-decoration: none; color: {{t.tabSoft}}; font-size: 13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 15c3-1 4-4 7-4s3 3 6 2"/><path d="M8 19c3-1 4-4 7-4s3 3 6 2"/><path d="M5 10c2-1 3-3 5-3"/></svg>
      Flock
    </a>
    <a href="#me" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 44px; justify-content: center; text-decoration: none; color: {{t.tabSoft}}; font-size: 13px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="9" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>
      Me
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["parchment","candlelight"],"default":"parchment"},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  parchment: {
    chromeBg: '#ebdfc3', chromeInk: '#2a1f15', chromeSoft: '#665441', tabBg: '#e5d7b8', tabSoft: '#6e5b46',
    rule: 'rgba(90,66,38,0.25)', accent: '#8b2f1c', accentInk: '#f7efdc', accentHalo: 'rgba(139,47,28,0.18)',
    page: 'radial-gradient(120% 90% at 50% 30%, #f6edd6 0%, #efe3c6 60%, #e0cfa8 100%)',
    pageShadow: '0 1px 0 rgba(90,66,38,0.15), 0 6px 18px rgba(90,66,38,0.12)',
    pageSoft: '#6a5741', accentOnPage: '#8b2f1c', birdFilter: 'none', sketchFilter: 'grayscale(1)'
  },
  candlelight: {
    chromeBg: '#17100a', chromeInk: '#f2e2c0', chromeSoft: '#c4a77b', tabBg: '#120c07', tabSoft: '#a98f68',
    rule: 'rgba(242,226,192,0.14)', accent: '#e9a24f', accentInk: '#1b130c', accentHalo: 'rgba(233,162,79,0.22)',
    page: 'radial-gradient(115% 100% at 50% 38%, #ecd3a4 0%, #d8b986 50%, #b8935e 85%, #8f6d42 100%)',
    pageShadow: '0 0 40px rgba(233,162,79,0.18)',
    pageSoft: '#4e3a22', accentOnPage: '#7a2812', birdFilter: 'sepia(0.12) saturate(0.95)', sketchFilter: 'grayscale(1) sepia(0.4)'
  }
};
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'parchment';
    return { t: THEMES[theme] ?? THEMES.parchment };
  }
}
</script>
</body>
</html>
